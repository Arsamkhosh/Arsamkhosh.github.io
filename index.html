<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ارزیابی تهران | قیمت لحظه‌ای ارز و طلا</title>
  
  <!-- Modern Persian Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #07080c;
      --card-bg: rgba(18, 21, 31, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(243, 202, 108, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --gold: #f3ca6c;
      --gold-glow: rgba(243, 202, 108, 0.2);
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.2);
      --red: #ef4444;
      --purple-aura: rgba(139, 92, 246, 0.15);
      --blue-aura: rgba(59, 130, 246, 0.15);
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }

    /* AURA EFFECT BACKGROUND (Optimized for Mobile) */
    .aura-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .aura-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      will-change: transform;
      transform: translateZ(0);
      opacity: 0.6;
    }

    .aura-1 {
      top: -10%;
      right: -10%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%);
      animation: auraFloat1 18s ease-infinite alternate;
    }

    .aura-2 {
      bottom: -15%;
      left: -15%;
      width: 70vw;
      height: 70vw;
      background: radial-gradient(circle, var(--purple-aura) 0%, transparent 70%);
      animation: auraFloat2 22s ease-infinite alternate;
    }

    .aura-3 {
      top: 40%;
      left: 20%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, var(--blue-aura) 0%, transparent 70%);
      animation: auraFloat1 15s ease-infinite alternate-reverse;
    }

    @keyframes auraFloat1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-30px, 40px) scale(1.1); }
    }

    @keyframes auraFloat2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -30px) scale(1.05); }
    }

    .container {
      width: min(1200px, calc(100% - 28px));
      margin: auto;
      padding: 32px 0 60px;
    }

    /* HEADER */
    header {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
    }

    .logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 16px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(243, 202, 108, 0.25), rgba(255, 255, 255, 0.03));
      border: 1px solid rgba(243, 202, 108, 0.4);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 25px var(--gold-glow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 30px;
    }

    h1 {
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 400;
    }

    .status {
      margin: 16px auto 0;
      width: fit-content;
      padding: 6px 14px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      display: inline-block;
    }

    .status.ok .status-dot {
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
      animation: pulse 2s infinite;
    }

    .status.error .status-dot {
      background: var(--red);
      box-shadow: 0 0 10px var(--red);
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* SEARCH */
    .search-box {
      margin-bottom: 20px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      height: 50px;
      padding: 0 18px 0 46px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      outline: none;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text-main);
      font-size: 14px;
      font-family: inherit;
      transition: all 0.25s ease;
    }

    .search-box input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 20px var(--gold-glow);
      background: rgba(22, 26, 38, 0.8);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* TABS */
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 28px;
      padding-bottom: 6px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 0 0 auto;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-muted);
      padding: 9px 18px;
      border-radius: 14px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .tab:active {
      transform: scale(0.96);
    }

    .tab.active {
      background: linear-gradient(135deg, rgba(243, 202, 108, 0.2), rgba(243, 202, 108, 0.05));
      color: var(--gold);
      border-color: rgba(243, 202, 108, 0.4);
      box-shadow: 0 4px 15px var(--gold-glow);
    }

    /* SECTION */
    .section {
      margin-bottom: 32px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
    }

    .section-title span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: rgba(243, 202, 108, 0.12);
      color: var(--gold);
      font-size: 15px;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .price-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 18px;
      min-height: 125px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    /* Aura inner glow on hover/touch */
    .price-card::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      border-radius: 18px;
      background: radial-gradient(circle at top right, var(--gold-glow), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .price-card:hover::after,
    .price-card:active::after {
      opacity: 1;
    }

    .price-card:hover,
    .price-card:active {
      transform: translateY(-3px);
      border-color: var(--card-hover-border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 18px var(--gold-glow);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: relative;
      z-index: 1;
    }

    .name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .code {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      direction: ltr;
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .price-container {
      margin-top: 12px;
      position: relative;
      z-index: 1;
    }

    .price {
      font-size: 21px;
      font-weight: 800;
      color: var(--green);
      direction: ltr;
      text-align: right;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .unit {
      margin-top: 4px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 400;
    }

    /* FOOTER */
    footer {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--card-border);
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
    }

    .telegram {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 11px 22px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--text-main);
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(59, 130, 246, 0.05));
      border: 1px solid rgba(59, 130, 246, 0.35);
      font-weight: 600;
      transition: all 0.25s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .telegram:active {
      transform: scale(0.97);
    }

    .updated {
      margin-top: 8px;
      color: var(--text-muted);
      font-size: 11px;
      opacity: 0.8;
    }

    /* RESPONSIVE & MOBILE OPTIMIZATIONS */
    @media (max-width: 992px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 680px) {
      .container { width: min(100% - 20px, 1200px); padding-top: 20px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .price-card { padding: 14px; min-height: 110px; border-radius: 16px; }
      .price { font-size: 17px; }
      .name { font-size: 13px; }
      
      /* Mobile Aura Size Adjustments */
      .aura-1 { width: 90vw; height: 90vw; }
      .aura-2 { width: 100vw; height: 100vw; }
    }

    @media (max-width: 380px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

  <!-- AURA BACKGROUND ANIMATION -->
  <div class="aura-bg">
    <div class="aura-blob aura-1"></div>
    <div class="aura-blob aura-2"></div>
    <div class="aura-blob aura-3"></div>
  </div>

  <div class="container">

    <header>
      <div class="logo">📊</div>
      <h1>ارزیابی تهران</h1>
      <div class="subtitle">قیمت لحظه‌ای ارز، طلا، سکه و حواله‌جات</div>
      <div id="status" class="status">
        <span class="status-dot"></span>
        <span id="statusText">در حال دریافت اطلاعات...</span>
      </div>
    </header>

    <!-- SEARCH -->
    <div class="search-box">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="search" type="text" placeholder="جستجوی سریع (مثلا: یورو، USD، طلا)..." autocomplete="off">
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" data-category="all">⚡ همه موارد</button>
      <button class="tab" data-category="currency">💵 ارزهای رایج</button>
      <button class="tab" data-category="gold">🥇 طلا و انس</button>
      <button class="tab" data-category="havaleh">💱 حواله‌ها</button>
    </div>

    <!-- CONTENT -->
    <main id="content"></main>

    <!-- FOOTER -->
    <footer>
      <div>آخرین بروزرسانی داده‌ها: <strong id="updatedAt" style="color: var(--text-main);">---</strong></div>
      <div class="updated">🔄 همگام‌سازی خودکار هوشمند هر ۱۵ دقیقه انجام می‌شود</div>

      <a class="telegram" href="https://t.me/arzyabi_tehran" target="_blank" rel="noopener noreferrer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
        عضویت در کانال تلگرام
      </a>
    </footer>

  </div>

  <script>
    const API_URL = "https://dolar.arsam2260139122.workers.dev/api/site";

    const items = [
      // CURRENCY
      { id: "dollar", name: "دلار آمریکا", code: "USD", category: "currency", key: "dollar", unit: "تومان" },
      { id: "usdt", name: "تتر (دیجیتال)", code: "USDT", category: "currency", key: "usdt", unit: "تومان" },
      { id: "euro", name: "یورو", code: "EUR", category: "currency", key: "euro", unit: "تومان" },
      { id: "pound", name: "پوند انگلیس", code: "GBP", category: "currency", key: "pound", unit: "تومان" },
      { id: "dirham", name: "درهم امارات", code: "AED", category: "currency", key: "dirham", unit: "تومان" },
      { id: "lira", name: "لیر ترکیه", code: "TRY", category: "currency", key: "lira", unit: "تومان" },
      { id: "baht", name: "بات تایلند", code: "THB", category: "currency", key: "baht", unit: "تومان" },
      { id: "yen", name: "ین ژاپن", code: "JPY", category: "currency", key: "yen", unit: "تومان" },
      { id: "aud", name: "دلار استرالیا", code: "AUD", category: "currency", key: "aud", unit: "تومان" },
      { id: "nzd", name: "دلار نیوزیلند", code: "NZD", category: "currency", key: "nzd", unit: "تومان" },
      { id: "cad", name: "دلار کانادا", code: "CAD", category: "currency", key: "cad", unit: "تومان" },
      { id: "sgd", name: "دلار سنگاپور", code: "SGD", category: "currency", key: "sgd", unit: "تومان" },
      { id: "chf", name: "فرانک سوئیس", code: "CHF", category: "currency", key: "chf", unit: "تومان" },
      { id: "herat", name: "دلار هرات", code: "HERAT", category: "currency", key: "herat", unit: "تومان" },

      // GOLD
      { id: "gold18", name: "طلای ۱۸ عیار", code: "18K", category: "gold", key: "gold18", unit: "تومان / گرم" },
      { id: "bubble18", name: "حباب طلای ۱۸", code: "BUBBLE", category: "gold", key: "bubble18", unit: "تومان" },
      { id: "gold24", name: "طلای ۲۴ عیار", code: "24K", category: "gold", key: "gold24", unit: "تومان / گرم" },
      { id: "xau", name: "اونس جهانی طلا", code: "XAU", category: "gold", key: "xau", unit: "دلار" },

      // HAVALEH
      { id: "eur_hav", name: "حواله یورو", code: "EUR", category: "havaleh", key: "eur_hav", unit: "تومان" },
      { id: "gbp_hav", name: "حواله پوند", code: "GBP", category: "havaleh", key: "gbp_hav", unit: "تومان" },
      { id: "aud_hav", name: "حواله دلار استرالیا", code: "AUD", category: "havaleh", key: "aud_hav", unit: "تومان" },
      { id: "myr_hav", name: "حواله رینگیت مالزی", code: "MYR", category: "havaleh", key: "myr_hav", unit: "تومان" },
      { id: "cny_hav", name: "حواله یوان چین", code: "CNY", category: "havaleh", key: "cny_hav", unit: "تومان" },
      { id: "try_hav", name: "حواله لیر ترکیه", code: "TRY", category: "havaleh", key: "try_hav", unit: "تومان" },
      { id: "jpy_hav", name: "حواله ین ژاپن", code: "JPY", category: "havaleh", key: "jpy_hav", unit: "تومان" },
      { id: "cad_hav", name: "حواله دلار کانادا", code: "CAD", category: "havaleh", key: "cad_hav", unit: "تومان" },
      { id: "aed_hav", name: "حواله درهم", code: "AED", category: "havaleh", key: "aed_hav", unit: "تومان" }
    ];

    let prices = {};
    let activeCategory = "all";
    let searchText = "";

    function formatNumber(value) {
      if (value === null || value === undefined || value === "" || Number.isNaN(Number(value))) {
        return "---";
      }
      return Number(value).toLocaleString("fa-IR");
    }

    function formatDate(timestamp) {
      if (!timestamp) return "---";
      const date = new Date(Number(timestamp));
      if (Number.isNaN(date.getTime())) return "---";

      return date.toLocaleString("fa-IR", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function render() {
      const content = document.getElementById("content");
      content.innerHTML = "";

      const filtered = items.filter(item => {
        const categoryMatch = activeCategory === "all" || item.category === activeCategory;
        const searchMatch = !searchText ||
          item.name.toLowerCase().includes(searchText) ||
          item.code.toLowerCase().includes(searchText);

        return categoryMatch && searchMatch;
      });

      const categories = [
        { id: "currency", title: "ارزهای رایج", icon: "💵" },
        { id: "gold", title: "طلا و شاخص‌ها", icon: "🥇" },
        { id: "havaleh", title: "حواله‌جات", icon: "💱" }
      ];

      categories.forEach(category => {
        if (activeCategory !== "all" && activeCategory !== category.id) return;

        const categoryItems = filtered.filter(item => item.category === category.id);
        if (!categoryItems.length) return;

        const section = document.createElement("section");
        section.className = "section";

        const title = document.createElement("div");
        title.className = "section-title";
        title.innerHTML = `<span>${category.icon}</span>${category.title}`;

        const grid = document.createElement("div");
        grid.className = "grid";

        categoryItems.forEach(item => {
          const card = document.createElement("div");
          card.className = "price-card";
          const value = prices[item.key];

          card.innerHTML = `
            <div class="card-top">
              <div class="name">${item.name}</div>
              <div class="code">${item.code}</div>
            </div>
            <div class="price-container">
              <div class="price">${formatNumber(value)}</div>
              <div class="unit">${item.unit}</div>
            </div>
          `;
          grid.appendChild(card);
        });

        section.appendChild(title);
        section.appendChild(grid);
        content.appendChild(section);
      });
    }

    async function loadPrices() {
      const status = document.getElementById("status");
      const statusText = document.getElementById("statusText");

      status.className = "status";
      statusText.textContent = "در حال بروزرسانی قیمت‌ها...";

      try {
        const response = await fetch(API_URL + "?t=" + Date.now(), {
          method: "GET",
          headers: { "Accept": "application/json" },
          cache: "no-store"
        });

        if (!response.ok) throw new Error("HTTP " + response.status);

        const result = await response.json();
        if (!result || result.success !== true || !result.prices) throw new Error("Invalid API response");

        prices = result.prices;
        localStorage.setItem("arzyabi_tehran_prices", JSON.stringify(result));

        document.getElementById("updatedAt").textContent = formatDate(prices.timestamp || result.updatedAt);
        status.className = "status ok";
        statusText.textContent = "قیمت‌ها بروزرسانی شدند";

        render();
      } catch (error) {
        console.error("Price API error:", error);

        try {
          const cached = localStorage.getItem("arzyabi_tehran_prices");
          if (cached) {
            const result = JSON.parse(cached);
            if (result && result.prices) {
              prices = result.prices;
              document.getElementById("updatedAt").textContent = formatDate(prices.timestamp || result.updatedAt);
              status.className = "status";
              statusText.textContent = "نمایش داده‌های آفلاین (ذخیره‌شده)";
              render();
              return;
            }
          }
        } catch (cacheError) {
          console.error("Cache error:", cacheError);
        }

        status.className = "status error";
        statusText.textContent = "خطا در دریافت قیمت‌ها";
        render();
      }
    }

    // CATEGORY TABS
    document.querySelectorAll(".tab").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
        button.classList.add("active");
        activeCategory = button.dataset.category;
        render();
      });
    });

    // SEARCH
    document.getElementById("search").addEventListener("input", event => {
      searchText = event.target.value.trim().toLowerCase();
      render();
    });

    // INITIAL LOAD & AUTO UPDATE
    loadPrices();
