
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0d">

  <title>سایت در حال به‌روزرسانی | ارزیابی تهران</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0b0b0d;
      --gold: #d7b56d;
      --gold-light: #f5df9b;
      --text: #f4f0e7;
      --muted: #99979a;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 40%,
          rgba(215, 181, 109, 0.10), transparent 48%),
        var(--bg);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
    }

    /* پس‌زمینه */

    .background-glow {
      position: fixed;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: rgba(215, 181, 109, 0.07);
      filter: blur(100px);
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 620px;
      text-align: center;
      position: relative;
      z-index: 1;
      animation: appear 1s ease both;
    }

    /* لوگو */

    .logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(215, 181, 109, 0.55);
      border-radius: 25px;
      background: linear-gradient(
        145deg,
        rgba(215, 181, 109, 0.14),
        rgba(215, 181, 109, 0.02)
      );
      box-shadow: 0 0 45px rgba(215, 181, 109, 0.08);
      transform: rotate(-3deg);
    }

    .logo span {
      color: var(--gold-light);
      font-size: 35px;
      font-weight: bold;
      transform: rotate(3deg);
    }

    .brand {
      color: var(--gold);
      font-size: 14px;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    /* تیتر اصلی */

    h1 {
      color: var(--gold-light);
      font-size: clamp(25px, 5vw, 39px);
      line-height: 1.9;
      font-weight: 800;
      margin-bottom: 18px;
      text-shadow: 0 0 35px rgba(215, 181, 109, 0.12);
    }

    .description {
      color: var(--muted);
      font-size: 15px;
      line-height: 2.2;
      max-width: 480px;
      margin: 0 auto;
    }

    .description strong {
      color: #e9d4a0;
      font-weight: 600;
    }

    /* نشانگر وضعیت */

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 30px;
      padding: 12px 19px;
      border: 1px solid rgba(215, 181, 109, 0.22);
      border-radius: 50px;
      background: rgba(215, 181, 109, 0.045);
      color: #d9c99f;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--gold);
      animation: pulse 1.5s infinite;
    }

    /* نوار بارگذاری */

    .progress {
      width: 100%;
      max-width: 300px;
      height: 3px;
      margin: 34px auto 0;
      border-radius: 10px;
      background: #292621;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 35%;
      border-radius: 10px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--gold),
        var(--gold-light)
      );
      animation: loading 2s ease-in-out infinite;
    }

    .loading-text {
      margin-top: 13px;
      color: #77746c;
      font-size: 11px;
    }

    /* پاورقی */

    footer {
      margin-top: 65px;
      color: #65636a;
      font-size: 11px;
      line-height: 2;
    }

    footer span {
      color: var(--gold);
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.4;
        transform: scale(0.75);
      }
    }

    @keyframes loading {
      0% {
        transform: translateX(250%);
      }
      100% {
        transform: translateX(-350%);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .logo {
        width: 70px;
        height: 70px;
        border-radius: 21px;
      }

      .description {
        font-size: 13px;
      }

      footer {
        margin-top: 48px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <div class="background-glow"></div>

  <main class="container">

    <div class="logo" aria-hidden="true">
      <span>ا</span>
    </div>

    <div class="brand">ارزیابی تهران</div>

    <h1>سایت در حال به‌روزرسانی می‌باشد</h1>

    <p class="description">
      سایت با موفقیت <strong>آپدیت شده است</strong> و در حال
      بارگذاری نسخه جدید هستیم.
      <br>
      از شکیبایی شما سپاسگزاریم.
    </p>

    <div class="status">
      <span class="status-dot"></span>
      در حال آماده‌سازی نسخه جدید
    </div>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>

    <div class="loading-text">
      لطفاً تا تکمیل فرایند به‌روزرسانی منتظر بمانید...
    </div>

    <footer>
      <span>ارزیابی تهران</span>
      <br>
      تجربه‌ای تازه، به‌زودی در دسترس شما
    </footer>

  </main>
</body>
</html>
